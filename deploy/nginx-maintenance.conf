# expire365 / magazin — maintenance page during deploy
#
# Paste into the HTTPS server { } block, then:
#   sudo nginx -t && sudo systemctl reload nginx
#
# IMPORTANT: put the MAINTENANCE `if` inside `location /` only.
# A server-level `if` also hits /maintenance.html and shows nginx's default 503.
#
# update-magazin.sh creates /var/www/magazin/MAINTENANCE while deploying and
# removes it only after a successful finish. If deploy fails, the flag stays so
# visitors keep seeing the maintenance page until you fix and re-run (or:
#   rm -f /var/www/magazin/MAINTENANCE
# ).

error_page 502 503 504 /maintenance.html;

location = /maintenance.html {
  root /var/www/magazin/public;
  add_header Retry-After 120 always;
  add_header Cache-Control "no-store" always;
}

location / {
  if (-f /var/www/magazin/MAINTENANCE) {
    return 503;
  }

  # ... your existing proxy_pass and proxy_set_header lines ...
}
