<!doctype html>
<html lang="bg">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Pay mock · Expire365</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #09090b;
        --fg: #fafafa;
        --muted: #a1a1aa;
        --border: #3f3f46;
        --primary: #34d399;
        --selected: rgb(16 185 129 / 0.18);
        --revolut: #0075eb;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #000;
        color: var(--fg);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI",
          sans-serif;
      }
      .page {
        max-width: 28rem;
        margin: 0 auto;
        padding: 1rem 1rem 2rem;
      }
      .chrome {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 0.75rem;
        margin-bottom: 0.75rem;
      }
      .chrome h1 {
        margin: 0;
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .chrome p {
        margin: 0.25rem 0 0;
        font-size: 0.8rem;
        color: var(--muted);
        line-height: 1.4;
      }
      .lang {
        display: flex;
        gap: 0.35rem;
        flex-shrink: 0;
      }
      .lang button {
        appearance: none;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--fg);
        border-radius: 999px;
        padding: 0.35rem 0.65rem;
        font-size: 0.7rem;
        font-weight: 700;
        cursor: pointer;
      }
      .lang button[aria-pressed="true"] {
        border-color: var(--primary);
        color: var(--primary);
      }
      .phone {
        border: 1px solid var(--border);
        border-radius: 1.25rem;
        overflow: hidden;
        background: var(--bg);
        padding: 0.85rem 0.85rem 1rem;
      }
      .status {
        display: flex;
        justify-content: space-between;
        font-size: 0.7rem;
        color: var(--muted);
        margin-bottom: 0.65rem;
        padding: 0 0.15rem;
      }
      .title {
        margin: 0;
        font-size: 1.5rem;
        font-weight: 600;
      }
      .sub {
        margin: 0.25rem 0 0;
        font-size: 0.875rem;
        color: var(--muted);
      }
      .card {
        margin-top: 1rem;
        border: 1px solid var(--border);
        border-left: 4px solid var(--primary);
        border-radius: 1rem;
        padding: 0.85rem 0.95rem;
        background: var(--selected);
      }
      .kicker {
        margin: 0;
        font-size: 0.7rem;
        font-weight: 500;
        color: var(--muted);
      }
      .amount {
        margin: 0.2rem 0 0;
        font-size: 1.85rem;
        font-weight: 600;
        color: var(--fg);
      }
      .section {
        margin: 0.85rem 0 0.45rem;
        font-size: 0.875rem;
        font-weight: 600;
      }
      .row {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        appearance: none;
        background: transparent;
        border: 1px solid var(--border);
        border-radius: 0.75rem;
        color: var(--fg);
        font-size: 0.875rem;
        font-weight: 600;
        padding: 0.65rem 0.75rem;
        margin-bottom: 0.5rem;
        cursor: pointer;
        text-align: left;
      }
      .row-left {
        display: flex;
        align-items: center;
        gap: 0.65rem;
        min-width: 0;
      }
      .row-icon {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 2rem;
        height: 2rem;
        flex-shrink: 0;
        border-radius: 999px;
        border: 1px solid rgb(52 211 153 / 0.45);
        color: var(--primary);
        font-size: 0.75rem;
        font-weight: 700;
      }
      .row-icon.revolut {
        border-color: rgb(0 117 235 / 0.55);
        color: #60a5fa;
      }
      .row span.chev {
        color: var(--primary);
        font-size: 1.1rem;
      }
      .back {
        width: 100%;
        margin-top: 0.75rem;
        appearance: none;
        background: transparent;
        border: 1px solid var(--border);
        border-radius: 0.75rem;
        color: var(--fg);
        font-size: 0.875rem;
        font-weight: 600;
        padding: 0.65rem 0.75rem;
        cursor: pointer;
      }
      .overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgb(0 0 0 / 0.6);
        align-items: flex-end;
        justify-content: center;
        padding: 1.5rem 1rem max(1rem, env(safe-area-inset-bottom));
        z-index: 20;
      }
      .overlay.open {
        display: flex;
      }
      @media (min-width: 640px) {
        .overlay {
          align-items: center;
        }
      }
      .sheet {
        position: relative;
        width: 100%;
        max-width: 22rem;
        border: 1px solid var(--border);
        border-radius: 1rem;
        background: var(--bg);
        padding: 1.1rem 1rem 1rem;
        box-shadow: 0 20px 50px rgb(0 0 0 / 0.5);
        overflow: hidden;
      }
      .sheet-glow {
        pointer-events: none;
        position: absolute;
        inset: 0 0 auto;
        height: 9rem;
        background: radial-gradient(
          ellipse at 50% 0%,
          rgb(52 211 153 / 0.18),
          transparent 65%
        );
      }
      .sheet-glow.revolut {
        background: radial-gradient(
          ellipse at 50% 0%,
          rgb(0 117 235 / 0.22),
          transparent 65%
        );
      }
      .sheet-badge {
        position: relative;
        display: inline-flex;
        align-items: center;
        border-radius: 999px;
        border: 1px solid rgb(52 211 153 / 0.45);
        background: rgb(52 211 153 / 0.1);
        color: var(--primary);
        font-size: 0.65rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        padding: 0.25rem 0.65rem;
        margin-bottom: 0.65rem;
      }
      .sheet-badge.revolut {
        border-color: rgb(0 117 235 / 0.55);
        background: rgb(0 117 235 / 0.12);
        color: #60a5fa;
      }
      .sheet h2 {
        position: relative;
        margin: 0;
        font-size: 1.125rem;
        font-weight: 600;
      }
      .detail {
        margin-top: 0.75rem;
        border: 1px solid var(--border);
        border-radius: 1rem;
        overflow: hidden;
        max-height: min(24rem, 55vh);
        overflow-y: auto;
      }
      .detail-row {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 0.5rem;
        padding: 0.65rem 0.75rem;
        border-bottom: 1px solid var(--border);
      }
      .detail-row:last-child {
        border-bottom: 0;
      }
      .detail-row .label {
        margin: 0;
        font-size: 0.7rem;
        font-weight: 500;
        color: var(--muted);
      }
      .detail-row .value {
        margin: 0.15rem 0 0;
        font-size: 0.875rem;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        word-break: break-all;
      }
      .copy {
        flex-shrink: 0;
        width: 2rem;
        height: 2rem;
        border: 1px solid var(--border);
        border-radius: 0.375rem;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        font-size: 0.65rem;
        font-weight: 700;
      }
      .copy.ok {
        border-color: rgb(52 211 153 / 0.5);
        color: var(--primary);
      }
      .sheet-actions {
        position: relative;
        display: grid;
        gap: 0.5rem;
        margin-top: 1rem;
      }
      .open-link {
        display: none;
        width: 100%;
        text-align: center;
        text-decoration: none;
        appearance: none;
        background: transparent;
        border: 1px solid var(--primary);
        border-radius: 0.75rem;
        color: var(--primary);
        font-size: 0.875rem;
        font-weight: 600;
        padding: 0.65rem 0.75rem;
        cursor: pointer;
      }
      .open-link.show {
        display: block;
      }
      .open-link.revolut {
        border-color: rgb(0 117 235 / 0.75);
        color: #60a5fa;
      }
      .close {
        width: 100%;
        appearance: none;
        background: transparent;
        border: 1px solid var(--border);
        border-radius: 0.75rem;
        color: var(--fg);
        font-size: 0.875rem;
        font-weight: 600;
        padding: 0.65rem 0.75rem;
        cursor: pointer;
      }
      .hint {
        margin-top: 0.85rem;
        font-size: 0.75rem;
        color: var(--muted);
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="chrome">
        <div>
          <h1>Pay page mock</h1>
          <p data-i18n="hint">
            Плащане: дължима сума + банков превод / Revolut. Натиснете ред за
            попъп с копиране.
          </p>
        </div>
        <div class="lang">
          <button type="button" id="bg" aria-pressed="true">BG</button>
          <button type="button" id="en" aria-pressed="false">EN</button>
        </div>
      </div>

      <div class="phone">
        <div class="status"><span>9:41</span><span>●●● 100%</span></div>
        <h2 class="title" data-i18n="title">Плащане</h2>
        <p class="sub" data-i18n="subtitle">Дължима сума и начини за плащане</p>

        <div class="card">
          <p class="kicker" data-i18n="amountDue">Дължима сума</p>
          <p class="amount">€35</p>
        </div>

        <p class="section" data-i18n="methods">Начини за плащане</p>
        <button type="button" class="row" id="open-bank">
          <span class="row-left">
            <span class="row-icon" aria-hidden>€</span>
            <span data-i18n="bank">Банков превод</span>
          </span>
          <span class="chev">›</span>
        </button>
        <button type="button" class="row" id="open-revolut">
          <span class="row-left">
            <span class="row-icon revolut" aria-hidden>R</span>
            <span data-i18n="revolut">Revolut</span>
          </span>
          <span class="chev">›</span>
        </button>
        <button type="button" class="back" data-i18n="back">← Назад</button>
      </div>

      <p class="hint" data-i18n="live">
        Жив екран: /app/billing/pay (след Плащане от Плащания).
      </p>
    </div>

    <div class="overlay" id="overlay" aria-hidden="true">
      <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
        <div class="sheet-glow" id="sheet-glow" aria-hidden="true"></div>
        <span class="sheet-badge" id="sheet-badge">Банков превод</span>
        <h2 id="sheet-title" data-i18n="bank">Банков превод</h2>
        <div class="detail" id="detail-rows"></div>
        <div class="sheet-actions">
          <a
            class="open-link"
            id="open-link"
            href="https://revolut.me/georgin"
            target="_blank"
            rel="noopener noreferrer"
            data-i18n="openRevolut"
          >
            Отвори в Revolut
          </a>
          <button type="button" class="close" id="close" data-i18n="close">
            Затвори
          </button>
        </div>
      </div>
    </div>

    <script>
      const copy = {
        bg: {
          hint: "Плащане: дължима сума + банков превод / Revolut. Натиснете ред за попъп с копиране.",
          title: "Плащане",
          subtitle: "Дължима сума и начини за плащане",
          amountDue: "Дължима сума",
          methods: "Начини за плащане",
          bank: "Банков превод",
          revolut: "Revolut",
          back: "← Назад",
          close: "Затвори",
          live: "Жив екран: /app/billing/pay (след Плащане от Плащания).",
          recipient: "Получател",
          revolutUser: "Revolut потребител",
          iban: "IBAN",
          bic: "BIC/SWIFT",
          bankName: "Банка",
          amount: "Сума",
          reference: "Основание",
          openRevolut: "Отвори в Revolut",
        },
        en: {
          hint: "Pay: amount due + Bank Transfer / Revolut. Tap a row for the copy popup.",
          title: "Pay",
          subtitle: "Amount due and how to pay",
          amountDue: "Amount due",
          methods: "Payment methods",
          bank: "Bank Transfer",
          revolut: "Revolut",
          back: "← Back",
          close: "Close",
          live: "Live screen: /app/billing/pay (from Billing → Pay).",
          recipient: "Recipient Name",
          revolutUser: "Revolut username",
          iban: "IBAN",
          bic: "BIC/SWIFT",
          bankName: "Bank Name",
          amount: "Amount",
          reference: "Payment reference",
          openRevolut: "Open in Revolut",
        },
      };

      let locale = "bg";
      let mode = "bank";

      const bankRows = [
        { label: "recipient", value: "Georgi Nikolov" },
        { label: "iban", value: "BG29FINV91501015456617" },
        { label: "bic", value: "FINVBGSF" },
        { label: "bankName", value: "First Investment Bank" },
        { label: "amount", value: "€35" },
        { label: "reference", value: "E365-K7M2-202610-P9QX" },
      ];
      const revolutRows = [
        { label: "revolutUser", value: "@georgin" },
        { label: "amount", value: "€35" },
        { label: "reference", value: "E365-K7M2-202610-P9QX" },
      ];

      function applyLocale() {
        const c = copy[locale];
        document.querySelectorAll("[data-i18n]").forEach((el) => {
          const key = el.getAttribute("data-i18n");
          if (key && c[key] != null) el.textContent = c[key];
        });
        document.getElementById("bg").setAttribute("aria-pressed", String(locale === "bg"));
        document.getElementById("en").setAttribute("aria-pressed", String(locale === "en"));
        if (document.getElementById("overlay").classList.contains("open")) {
          renderSheet();
        }
      }

      function renderSheet() {
        const c = copy[locale];
        const title = document.getElementById("sheet-title");
        const badge = document.getElementById("sheet-badge");
        const glow = document.getElementById("sheet-glow");
        const isRevolut = mode === "revolut";
        title.textContent = isRevolut ? c.revolut : c.bank;
        badge.textContent = isRevolut ? c.revolut : c.bank;
        badge.classList.toggle("revolut", isRevolut);
        glow.classList.toggle("revolut", isRevolut);
        const openLink = document.getElementById("open-link");
        openLink.classList.toggle("show", isRevolut);
        openLink.classList.toggle("revolut", isRevolut);
        openLink.textContent = c.openRevolut;
        const rows = isRevolut ? revolutRows : bankRows;
        const host = document.getElementById("detail-rows");
        host.innerHTML = rows
          .map(
            (row) => `
          <div class="detail-row">
            <div>
              <p class="label">${c[row.label]}</p>
              <p class="value">${row.value}</p>
            </div>
            <button type="button" class="copy" data-copy="${row.value}">⎘</button>
          </div>`,
          )
          .join("");
        host.querySelectorAll("[data-copy]").forEach((btn) => {
          btn.addEventListener("click", async () => {
            const text = btn.getAttribute("data-copy") || "";
            try {
              await navigator.clipboard.writeText(text);
            } catch {
              /* ignore */
            }
            btn.textContent = "✓";
            btn.classList.add("ok");
            setTimeout(() => {
              btn.textContent = "⎘";
              btn.classList.remove("ok");
            }, 1200);
          });
        });
      }

      function openSheet(next) {
        mode = next;
        renderSheet();
        const overlay = document.getElementById("overlay");
        overlay.classList.add("open");
        overlay.setAttribute("aria-hidden", "false");
      }

      function closeSheet() {
        const overlay = document.getElementById("overlay");
        overlay.classList.remove("open");
        overlay.setAttribute("aria-hidden", "true");
      }

      document.getElementById("bg").onclick = () => {
        locale = "bg";
        applyLocale();
      };
      document.getElementById("en").onclick = () => {
        locale = "en";
        applyLocale();
      };
      document.getElementById("open-bank").onclick = () => openSheet("bank");
      document.getElementById("open-revolut").onclick = () => openSheet("revolut");
      document.getElementById("close").onclick = closeSheet;
      document.getElementById("overlay").onclick = (e) => {
        if (e.target.id === "overlay") closeSheet();
      };

      applyLocale();
      openSheet("revolut");
    </script>
  </body>
</html>
