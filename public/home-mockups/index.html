<!doctype html>
<html lang="bg">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Expire365 home icon options</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #09090b;
        --card: #121214;
        --text: #fafafa;
        --muted: #a1a1aa;
        --accent: #34d399;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        padding: 24px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.35rem;
      }
      p {
        margin: 0 0 24px;
        color: var(--muted);
      }
      h2 {
        margin: 32px 0 12px;
        font-size: 1rem;
        color: var(--accent);
        font-weight: 600;
      }
      .grid {
        display: grid;
        gap: 20px;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        max-width: 1400px;
      }
      figure {
        margin: 0;
        background: var(--card);
        border-radius: 16px;
        overflow: hidden;
        border: 1px solid #27272a;
      }
      figcaption {
        padding: 12px 14px;
        font-weight: 600;
        color: var(--accent);
      }
      figcaption span {
        display: block;
        margin-top: 4px;
        font-weight: 400;
        color: var(--muted);
        font-size: 0.85rem;
      }
      img {
        display: block;
        width: 100%;
        height: auto;
        background: #000;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <h1>Home icon — още възможности</h1>
    <p>Кликни за пълен размер. Свободни слотове: иконите пазят позиция (напр. 1, 5, 9).</p>

    <h2>Нови (5–10)</h2>
    <div class="grid">
      <figure>
        <a href="./expire365-home-opt-bare.jpg" target="_blank">
          <img src="./expire365-home-opt-bare.jpg" alt="5 Bare icons" />
        </a>
        <figcaption>5 — Bare icons<span>Само икона + етикет, без плочки</span></figcaption>
      </figure>
      <figure>
        <a href="./expire365-home-opt-bubbles.jpg" target="_blank">
          <img src="./expire365-home-opt-bubbles.jpg" alt="6 Soft bubbles" />
        </a>
        <figcaption>6 — Soft bubbles<span>Кръгли меки бутони</span></figcaption>
      </figure>
      <figure>
        <a href="./expire365-home-opt-big2.jpg" target="_blank">
          <img src="./expire365-home-opt-big2.jpg" alt="7 Big 2-column" />
        </a>
        <figcaption>7 — Big 2-column<span>Широки плочки, по-големи за пръст</span></figcaption>
      </figure>
      <figure>
        <a href="./expire365-home-opt-gradient.jpg" target="_blank">
          <img src="./expire365-home-opt-gradient.jpg" alt="8 Gradient badges" />
        </a>
        <figcaption>8 — Gradient badges<span>Мек тъмно→зелен градиент</span></figcaption>
      </figure>
      <figure>
        <a href="./expire365-home-opt-widget.jpg" target="_blank">
          <img src="./expire365-home-opt-widget.jpg" alt="9 Mixed widgets" />
        </a>
        <figcaption>9 — Mixed widgets<span>Голям 2×2 за Годност + малки икони</span></figcaption>
      </figure>
      <figure>
        <a href="./expire365-home-opt-dock.jpg" target="_blank">
          <img src="./expire365-home-opt-dock.jpg" alt="10 Dock" />
        </a>
        <figcaption>10 — Dock<span>Мрежа горе + долен dock като телефон</span></figcaption>
      </figure>
    </div>

    <h2>Предишни (1–4 + free slots)</h2>
    <div class="grid">
      <figure>
        <a href="./expire365-home-free-slots-normal.jpg" target="_blank">
          <img src="./expire365-home-free-slots-normal.jpg" alt="Free slots" />
        </a>
        <figcaption>Free slots<span>Пример: икони в 1, 5, 9</span></figcaption>
      </figure>
      <figure>
        <a href="./expire365-home-soft-ios.jpg" target="_blank">
          <img src="./expire365-home-soft-ios.jpg" alt="1 Soft filled" />
        </a>
        <figcaption>1 — Soft filled tiles<span>Charcoal квадрати без outline</span></figcaption>
      </figure>
      <figure>
        <a href="./expire365-home-soft-glow.jpg" target="_blank">
          <img src="./expire365-home-soft-glow.jpg" alt="2 Glow discs" />
        </a>
        <figcaption>2 — Glow discs<span>Кръгове със зелен ореол</span></figcaption>
      </figure>
      <figure>
        <a href="./expire365-home-soft-matte.jpg" target="_blank">
          <img src="./expire365-home-soft-matte.jpg" alt="3 Matte" />
        </a>
        <figcaption>3 — Matte tiles<span>Плоски тъмни квадрати</span></figcaption>
      </figure>
      <figure>
        <a href="./expire365-home-soft-rows.jpg" target="_blank">
          <img src="./expire365-home-soft-rows.jpg" alt="4 Soft rows" />
        </a>
        <figcaption>4 — Soft rows<span>Списък с карти</span></figcaption>
      </figure>
      <figure>
        <a href="./expire365-home-icons-cozy-tight.jpg" target="_blank">
          <img src="./expire365-home-icons-cozy-tight.jpg" alt="Bordered" />
        </a>
        <figcaption>Earlier — bordered<span>Зелени контури (Excel-ish)</span></figcaption>
      </figure>
    </div>
  </body>
</html>
