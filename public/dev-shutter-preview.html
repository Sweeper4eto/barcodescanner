<!doctype html>
<html lang="bg">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Document shutter preview</title>
    <style>
      :root {
        --bg: #09090b;
        --fg: #fafafa;
        --muted: #a1a1aa;
        --border: #3f3f46;
        --primary: #34d399;
        --nav-frame: 3.85rem;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--fg);
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
      }
      .shell {
        max-width: 32rem;
        margin: 0 auto;
        min-height: 100svh;
        padding: max(0.5rem, env(safe-area-inset-top, 0px)) 1rem
          calc(var(--nav-frame) + env(safe-area-inset-bottom, 0px));
      }
      .stage {
        position: relative;
        margin: 0 auto;
        aspect-ratio: 3 / 4;
        max-height: calc(100svh - var(--nav-frame) - env(safe-area-inset-bottom, 0px) - 7.5rem);
        width: 100%;
        border-radius: 1rem;
        border: 1px solid var(--border);
        background: #000;
        overflow: hidden;
      }
      .stage .vf {
        position: absolute;
        inset: 8px;
        pointer-events: none;
      }
      .stage .vf span {
        position: absolute;
        width: 18px;
        height: 18px;
        border-color: var(--primary);
        border-style: solid;
        opacity: 0.85;
      }
      .stage .vf .tl { top: 0; left: 0; border-width: 2.5px 0 0 2.5px; }
      .stage .vf .tr { top: 0; right: 0; border-width: 2.5px 2.5px 0 0; }
      .stage .vf .bl { bottom: 0; left: 0; border-width: 0 0 2.5px 2.5px; }
      .stage .vf .br { bottom: 0; right: 0; border-width: 0 2.5px 2.5px 0; }
      .hint {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: rgba(255,255,255,0.75);
        font-size: 0.875rem;
        text-align: center;
        padding: 1.5rem;
      }
      .toolbar {
        position: fixed;
        left: 50%;
        transform: translateX(-50%);
        bottom: calc(var(--nav-frame) + env(safe-area-inset-bottom, 0px));
        width: 100%;
        max-width: 32rem;
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: end;
        gap: 0.5rem;
        padding: 0 1rem;
        background: rgb(9 9 11 / 0.95);
        z-index: 30;
      }
      .side {
        flex: 1;
        min-width: 0;
        min-height: 2.75rem;
        padding: 0.625rem 0.75rem;
        border-radius: 0.75rem;
        background: transparent;
        font-size: 0.875rem;
        font-weight: 600;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.35rem;
      }
      .side.cancel { border: 1px solid #fff; color: #fff; }
      .side.upload { border: 1px solid var(--primary); color: var(--primary); }
      .shutter {
        position: relative;
        width: 7rem;
        height: 7rem;
        flex-shrink: 0;
        color: var(--primary);
        background: transparent;
        border: none;
        padding: 0;
      }
      .shutter svg.corners {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .shutter svg.cam {
        position: absolute;
        left: 50%;
        top: 72.9%;
        width: 2.75rem;
        height: 2.75rem;
        transform: translate(-50%, -50%);
      }
      .nav {
        position: fixed;
        inset-inline: 0;
        bottom: 0;
        z-index: 40;
        border-top: 1px solid var(--border);
        background: rgb(9 9 11 / 0.95);
      }
      .nav-inner {
        max-width: 32rem;
        margin: 0 auto;
        min-height: 3.25rem;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        padding: 0.25rem 0.5rem calc(env(safe-area-inset-bottom, 0px) + 0.35rem);
      }
      .nav-inner span {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.25rem;
        font-size: 11px;
        font-weight: 500;
        color: var(--muted);
      }
      .nav-inner span.active { color: var(--primary); }
      .label {
        margin: 0.75rem 0 0;
        text-align: center;
        font-size: 0.75rem;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="stage">
        <div class="vf" aria-hidden="true">
          <span class="tl"></span><span class="tr"></span>
          <span class="bl"></span><span class="br"></span>
        </div>
        <div class="hint">Document camera preview<br />(live UI chrome)</div>
      </div>
      <p class="label">localhost preview — same layout as Сканирай</p>
    </div>

    <div class="toolbar">
      <button type="button" class="side cancel">Отказ</button>
      <button type="button" class="shutter" aria-label="Снимай">
        <svg class="corners" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5.5 15V11h4" />
          <path d="M18.5 15V11h-4" />
          <path d="M5.5 20v4h4" />
          <path d="M18.5 20v4h-4" />
        </svg>
        <svg class="cam" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 8.5h3.2l1.3-2h7l1.3 2H20a1.5 1.5 0 0 1 1.5 1.5v8A1.5 1.5 0 0 1 20 19.5H4A1.5 1.5 0 0 1 2.5 18v-8A1.5 1.5 0 0 1 4 8.5Z" />
          <circle cx="12" cy="13.5" r="3.25" />
        </svg>
      </button>
      <button type="button" class="side upload">Качване</button>
    </div>

    <nav class="nav" aria-label="Bottom">
      <div class="nav-inner">
        <span>Добави</span>
        <span class="active">Сканирай</span>
        <span>Годност</span>
      </div>
    </nav>
  </body>
</html>
