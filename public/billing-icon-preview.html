<!DOCTYPE html>
<html lang="bg">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Плащания — карта A</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #09090b;
        color: #fff;
        font-family: system-ui, sans-serif;
        display: grid;
        place-items: center;
      }
      .wrap {
        text-align: center;
      }
      .tile {
        width: 168px;
        height: 168px;
        margin: 0 auto 1rem;
        border-radius: 1.65rem;
        display: grid;
        place-items: center;
        background: linear-gradient(
          145deg,
          #1f2937 0%,
          #111827 45%,
          #064e3b 100%
        );
        box-shadow:
          0 10px 28px rgb(0 0 0 / 0.48),
          inset 0 1px 0 rgb(255 255 255 / 0.08);
      }
      svg {
        width: 78px;
        height: 78px;
        color: #34d399;
        filter: drop-shadow(0 1px 2px rgb(0 0 0 / 0.4));
      }
      .label {
        font-weight: 600;
        font-size: 1.1rem;
      }
      .hint {
        margin-top: 0.35rem;
        color: #a1a1aa;
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="tile" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none">
          <rect
            x="2"
            y="5"
            width="20"
            height="14"
            rx="2.2"
            stroke="currentColor"
            stroke-width="1.55"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path
            d="M2 10h20"
            stroke="currentColor"
            stroke-width="1.55"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <rect
            x="5"
            y="12.35"
            width="3.2"
            height="2.4"
            rx="0.45"
            stroke="currentColor"
            stroke-width="1.35"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path
            d="M10.2 13.55h7.6"
            stroke="currentColor"
            stroke-width="1.35"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path
            d="M10.2 15.55h4.8"
            stroke="currentColor"
            stroke-width="1.35"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </div>
      <div class="label">Плащания</div>
      <div class="hint">карта A — контур + лента + чип</div>
    </div>
  </body>
</html>
